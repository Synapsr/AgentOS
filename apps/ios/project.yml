# Xcode project for the AgentOS iPhone app. Generate it with `xcodegen`
# (the .xcodeproj is not checked in), then open AgentOS.xcodeproj.
name: AgentOS

options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    # The one place to change the bundle id (and to add your signing team
    # when you want to run on a real iPhone).
    APP_BUNDLE_ID: org.agentos.app
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  AgentOS:
    type: application
    platform: iOS
    sources:
      - AgentOS
      - Shared
      # The design tokens, generated from packages/design/tokens.json.
      - path: ../../packages/design/generated/Tokens.swift
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: AgentOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: AgentOS/Resources/AgentOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: AgentOSNotifications
      - target: AgentOSWatch
    scheme:
      testTargets:
        - AgentOSTests

  # Attaches what the agent sees to the notifications the computer pushes.
  AgentOSNotifications:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
      - AgentOS/Protocol
      - AgentOS/Net/NodeClient.swift
      - AgentOS/Store/Computer.swift
      - AgentOS/App/NotificationPicture.swift
      - AgentOS/App/RequestNotification.swift
      # The words of a notification, in the app's own catalog.
      - AgentOS/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).notifications
        INFOPLIST_FILE: NotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements

  # The Apple Watch app. It talks to the iPhone app, not to computers.
  AgentOSWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - Watch
      - Shared
      - path: ../../packages/design/generated/Tokens.swift
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AgentOS
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  AgentOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AgentOSTests
    dependencies:
      - target: AgentOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
